name: Daily Azure job digest

on:
  schedule:
    - cron: "30 4 * * 1,3,5"   # 04:30 UTC = 10:00 AM IST, Mon-Wed-Fri (change 1-5 to * for every day)
  workflow_dispatch:           # lets you run it manually from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Restore already-sent jobs
        uses: actions/cache@v4
        with:
          path: seen_jobs.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Search and email
        env:
          OPENWEBNINJA_API_KEY: ${{ secrets.OPENWEBNINJA_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}     # optional
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}   # optional
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # optional: exact Google Jobs results
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SHOW_UNCONFIRMED: "1"   # also list strong matches that do not mention sponsorship (set "0" for strict)
        run: python job_agent.py
